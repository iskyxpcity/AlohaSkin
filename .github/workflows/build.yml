name: AlohaSkin CI
on:
  push:
    branches: ["feature/voyage-visual-system-extraction-20261026"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build library and showcase
        run: gradle --no-daemon :aloha-skin:assembleDebug :showcase:assembleDebug
      - name: Upload showcase APK
        uses: actions/upload-artifact@v4
        with:
          name: AlohaSkin-Showcase-Debug-APK
          path: showcase/build/outputs/apk/debug/showcase-debug.apk
          if-no-files-found: error
          retention-days: 14
